<title>بالغوا بالدفاع عن وطنكم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Kufam:wght@600;800;900&family=Noto+Kufi+Arabic:wght@400;600;800&display=swap">
<style>
/* Layout: a 1080x1920 (9:16) motion stage letterboxed in a dark player. Every frame is a pure function of time t,
   so the page plays live and the same file exports frame-by-frame to video. Saudi palette: deep green, white, gold. */
:root{
  --bg:#04120c; --fg:#f6f1e1; --gold:#e8c26a; --gold-d:#b98d34; --green-d:#082a1d; --green:#0c3a28; --red:#f0594c;
  --ui:#0a2217; --ui-line:rgba(232,194,106,.30);
  --display:'Kufam','Noto Kufi Arabic','Tahoma',sans-serif;
  --text:'Noto Kufi Arabic','Tahoma',sans-serif;
  --legal:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);box-sizing:border-box;overflow:hidden;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;direction:rtl}
#view{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;border-radius:12px;background:#031009;box-shadow:0 0 0 1px rgba(232,194,106,.22),0 24px 60px rgba(0,0,0,.55)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;direction:rtl;background:#04140e}
#world,#world>*,.over{position:absolute;left:0;top:0;width:1080px;height:1920px}
canvas{pointer-events:none}
#bg{background:radial-gradient(ellipse 90% 62% at 74% 26%,#1a5c42 0%,#0c3427 40%,#05190f 78%,#030f09 100%)}
#glowL{background:radial-gradient(circle at 0% 50%,rgba(240,200,110,.40) 0%,rgba(240,200,110,.12) 32%,rgba(240,200,110,0) 62%);mix-blend-mode:screen}
#rays{background:conic-gradient(from 118deg at -8% 22%,rgba(255,226,150,0) 0deg,rgba(255,226,150,.16) 5deg,rgba(255,226,150,0) 12deg,rgba(255,226,150,.10) 20deg,rgba(255,226,150,0) 28deg,rgba(255,226,150,.14) 38deg,rgba(255,226,150,0) 47deg,rgba(255,226,150,.08) 58deg,rgba(255,226,150,0) 70deg);mix-blend-mode:screen;opacity:.55;transform-origin:0 22%}
#hero{overflow:hidden;background:#04140e}
#heroImg{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform}
#heroShade{position:absolute;inset:0;background:
  linear-gradient(to top,rgba(3,15,10,.98) 0%,rgba(3,15,10,.92) 26%,rgba(3,15,10,.5) 46%,rgba(3,15,10,0) 66%),
  linear-gradient(to bottom,rgba(3,15,10,.6) 0%,rgba(3,15,10,0) 24%)}
#heroSweep{position:absolute;top:-200px;left:0;width:360px;height:2400px;transform:skewX(-18deg);mix-blend-mode:screen;
  background:linear-gradient(90deg,rgba(255,236,170,0),rgba(255,236,170,.45),rgba(255,236,170,0))}
#gfx{overflow:visible}
#cvGlow{mix-blend-mode:screen}
.blk{position:absolute;left:0;width:1080px;text-align:center;direction:rtl;visibility:hidden;white-space:nowrap}
.blk > div{display:flex;justify-content:center;align-items:baseline;gap:.26em}
.disp{font-family:var(--display);font-weight:800}
.txt{font-family:var(--text);font-weight:700}
.w{display:inline-block;opacity:0;color:var(--fg);text-shadow:0 .03em 0 rgba(0,0,0,.35),0 .08em .35em rgba(0,0,0,.55)}
.w.g3{position:relative;text-shadow:none}
.g3 .ex{position:absolute;left:0;top:0;width:100%;white-space:nowrap;-webkit-text-fill-color:#8a6420;color:#8a6420;
  text-shadow:0 .015em 0 #7a5517,0 .03em 0 #70500f,0 .045em 0 #64460c,0 .06em 0 #58400a,0 .075em 0 #4a3408,0 .16em .22em rgba(0,0,0,.65)}
.g3 .fg{position:relative;white-space:nowrap;background:linear-gradient(176deg,#fff8d8 0%,#f7dc8a 20%,#d9a93f 44%,#fbe7a2 58%,#c08e2a 80%,#8f6a1f 100%);background-size:100% 240%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.red{color:var(--red)}
.chip{position:absolute;left:540px;transform:translate(-50%,-50%);padding:6px 32px 10px;border-radius:40px;background:linear-gradient(180deg,#0e3c2b,#072419);border:2px solid var(--gold);
  font:700 44px/1.35 var(--text);color:var(--fg);white-space:nowrap;opacity:0;box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18)}
#grain{background-size:200px 200px;opacity:.07;mix-blend-mode:overlay}
#vig{background:radial-gradient(ellipse 78% 64% at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.58) 100%)}
#flash{background:radial-gradient(circle at 72% 40%,rgba(255,236,170,.95) 0%,rgba(232,194,106,.6) 30%,rgba(232,194,106,0) 70%);opacity:0}
#fade{background:#02090a;opacity:1}
.em{fill:url(#gGold);stroke:#f6e3a4;stroke-width:3;stroke-linejoin:round}
.em.line{fill:none;stroke:url(#gGold);stroke-width:20;stroke-linecap:round}
.em.vein{fill:none;stroke:#7a5517;stroke-width:2;opacity:0}
.ic{fill:none;stroke:#e8c26a;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#bigPlay{position:absolute;inset:0;margin:auto;width:116px;height:116px;border-radius:50%;border:2px solid var(--gold);background:rgba(4,18,12,.72);
  color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);z-index:5;padding:0}
#bigPlay[hidden]{display:none}
#bigPlay svg{width:44px;height:44px;margin-right:-6px}
#bigPlay:hover{background:rgba(12,58,40,.85)}
#controls{width:min(100%,560px);display:flex;align-items:center;gap:14px;flex:none;padding-bottom:2px}
#controls button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--ui-line);background:var(--ui);color:var(--gold);
  display:flex;align-items:center;justify-content:center;flex:none}
#controls button:hover{background:#0f3324}
#controls button:focus-visible,#bigPlay:focus-visible,#seek:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#controls svg{width:20px;height:20px}
#seek{flex:1;min-width:0;accent-color:var(--gold);direction:ltr;height:28px}
#clock{font:500 14px/1 var(--text);color:#b9c9bd;font-variant-numeric:tabular-nums;direction:ltr;min-width:84px;text-align:center}
.render #controls,.render #bigPlay{display:none}
.render body{padding:0;margin:0;overflow:hidden}
.render #app,.render #view{display:block;height:auto}
.render #frame{position:absolute;left:0;top:0;border-radius:0;box-shadow:none}
</style>

/* Emblem v2: palm fan + crossed scimitars, drawn from measurements of the supplied relief photo.
   Coordinates are in "E-space" (px of the enhanced crop); the emblem is centred on EM2.cx,cy and scaled by the user. */
const EM2=(()=>{
  const CX=510, CY=555;                       // emblem centre in E-space (used to recentre)
  const f=n=>Math.round(n*10)/10;
  const P=(pts)=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
  const bez=(p0,p1,p2,p3,t)=>{const u=1-t;return[u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];};
  const dbez=(p0,p1,p2,p3,t)=>{const u=1-t;return[3*u*u*(p1[0]-p0[0])+6*u*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),3*u*u*(p1[1]-p0[1])+6*u*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1])];};
  /* ---- crown: fan of leaf rays from the trunk top ---- */
  const O=[505,452];
  function ray(aDeg,L,Wd,bend){
    const N=22,a=aDeg*Math.PI/180,ds=L/N;let x=0,y=0;const sp=[[0,0,a]];
    for(let i=1;i<=N;i++){const th=a+bend*Math.pow(i/N,1.4);x+=Math.cos(th)*ds;y+=Math.sin(th)*ds;sp.push([x,y,th]);}
    const A=[],B=[],mid=[];
    for(let i=0;i<=N;i++){const s=i/N,[px,py,th]=sp[i],nx=-Math.sin(th),ny=Math.cos(th);
      const w=Wd*.5*Math.sqrt(Math.max(0,1-Math.pow(s,5)))*Math.pow(Math.min(1,s/.2),.75)*(1-.12*s)+(i===0?3:0);
      A.push([O[0]+px+nx*w,O[1]+py+ny*w]);B.push([O[0]+px-nx*w,O[1]+py-ny*w]);mid.push([O[0]+px,O[1]+py]);}
    return{d:P(A.concat(B.reverse())),vein:'M'+mid.slice(2,N-1).map(p=>f(p[0])+' '+f(p[1])).join('L'),tip:mid[N]};
  }
  const rays=[];
  const K=14;
  for(let k=0;k<K;k++){
    const u=k/(K-1),ang=202+u*136;                  // 204deg (left) .. 336deg (right) through 270 (up)
    const L=316+70*Math.sin(Math.PI*u)-10*Math.abs(u-.5);
    const bend=-.34*Math.cos(ang*Math.PI/180)*1.0;    // outward droop (+ on right, - on left)
    rays.push(ray(ang,L,66+6*Math.sin(Math.PI*u),bend));
  }
  // short lower rays (the "teeth" under the crown)
  const low=[ray(196,150,44,-.5),ray(344,150,44,.5),ray(214,190,48,-.45),ray(326,190,48,.45)];
  /* ---- trunk + base ---- */
  const trunk='M478 446 C474 540 478 640 470 716 L548 716 C540 640 546 540 536 446 Z';
  const ridges=['M522 470 C514 540 534 600 524 700','M506 470 C500 540 516 610 508 706'];
  const mound='M392 752 C404 722 440 706 474 704 L548 704 C582 704 604 724 624 752 C604 760 584 758 566 748 C548 738 520 740 500 748 C470 758 430 760 392 752 Z';
  /* ---- swords ---- */
  const T=[28,688],G=[604,986],C1=[260,690],C2=[470,792];
  function blade(){
    const N=34,A=[],B=[],mid=[];
    for(let i=0;i<=N;i++){const s=i/N,p=bez(T,C1,C2,G,s),d=dbez(T,C1,C2,G,s),l=Math.hypot(d[0],d[1]),nx=-d[1]/l,ny=d[0]/l;

    return{d:P(A.concat(B.reverse())),mid};
  }
  const bl=blade();
  const fuller='M'+bl.mid.slice(6,32).map(p=>f(p[0])+' '+f(p[1])).join('L');
  const guard='M566 1030 C556 984 580 952 626 946 C650 944 668 954 666 970';
  const guard2='M601 1000 C640 996 690 1008 742 1024';
  const grip='M612 994 C664 1000 716 1016 776 1038';
  const pommel='M770 1038 a21 21 0 1 0 42 6 a21 21 0 1 0 -42 -6Z';const caps='M652 962 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0Z M556 1030 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0Z';
  const sword={blade:bl.d,fuller,guard,guard2,grip,pommel,caps};
  const mirrorX=x=>2*CX-x; // swords/crown are symmetric around x=CX
  return{CX,CY,rays,low,trunk,ridges,mound,sword,O};
})();

  if(AUD&&!AUD.paused&&AUD.currentTime>0)setT(AUD.currentTime);else setT(t+dt);
  if(t>=DUR-.02){playing=false;if(AUD)AUD.pause();btnState();return;}requestAnimationFrame(tick);}
function play(){if(!started||t>=DUR-.02)t=0;started=true;playing=true;bigPlay.hidden=true;btnState();last=performance.now();
  if(AUD){AUD.currentTime=t;AUD.play().catch(()=>{});}requestAnimationFrame(tick);}
function pause(){playing=false;if(AUD)AUD.pause();btnState();}
function fit(){
  if(RENDER){frame.style.width=W+'px';frame.style.height=H+'px';stage.style.transform='none';return;}
  const v=$('#view'),k=Math.min(v.clientWidth/W,v.clientHeight/H);
  frame.style.width=Math.floor(W*k)+'px';frame.style.height=Math.floor(H*k)+'px';stage.style.transform=`scale(${k})`;
}
btnPlay.onclick=()=>playing?pause():play();bigPlay.onclick=play;
$('#btnRestart').onclick=()=>{started=true;t=0;play();};
seek.oninput=()=>{bigPlay.hidden=true;started=true;setT(seek.value/100);if(AUD)AUD.currentTime=t;};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play();}});
addEventListener('resize',fit);

function fitAll(){
  FIT.forEach(([e,mx])=>{const w=e.getComputedTextLength();if(w>mx){e.setAttribute('font-size',(+e.getAttribute('font-size')*mx/w).toFixed(1));}});
  document.querySelectorAll('.blk > div').forEach(line=>{const r=document.createRange();r.selectNodeContents(line);const w=r.getBoundingClientRect().width,k=stage.getBoundingClientRect().width?(RENDER?1:stage.getBoundingClientRect().width/W):1;
    const cw=w/(k||1);if(cw>940){line.style.transform=`scale(${(940/cw).toFixed(4)})`;line.style.transformOrigin='50% 50%';}});
}
function boot(){
  init3D();initC3();initE3();makeGrain();fit();fitAll();
  seek.max=Math.round(DUR*100);
  gfx.querySelectorAll('path.em,path.ic').forEach(p=>{p.__L=p.getTotalLength()||1;p.style.strokeDasharray=p.__L+' '+p.__L;});
  window.__setTime=x=>{setT(x);return true;};window.__DUR=DUR;window.__ready=true;
  if(RENDER){setT(0);return;}
  setT(POSTER);btnState();
}
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 100px Kufam','بالغوا ٣٤'),document.fonts.load('900 100px Kufam','تساوم'),document.fonts.load('700 40px "Noto Kufi Arabic"','المجتمع'),document.fonts.load('400 40px Amiri','الدفاع')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(()=>{(document.fonts?document.fonts.ready:Promise.resolve()).then(boot);});
})();
</script>
